<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klöbels KI Podcast abonnieren</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="cover.jpg">
<style>
  :root { --bg:#0f2236; --card:#16324f; --text:#ffffff; --muted:#c9d6e3; --accent:#f2a541; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:20px; padding:28px 22px; text-align:center; }
  img.cover { width:100%; max-width:280px; border-radius:14px; display:block; margin:0 auto 20px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 22px; }
  a.btn { display:block; background:var(--accent); color:#1b1b1b; text-decoration:none; font-weight:700;
          font-size:18px; padding:16px; border-radius:12px; margin-bottom:14px; }
  .alt { font-size:14px; color:var(--muted); }
  code { display:block; word-break:break-all; background:rgba(255,255,255,.08); padding:10px; border-radius:8px;
         margin:8px 0 0; font-size:13px; color:var(--text); }
  button { margin-top:10px; background:none; border:1px solid var(--muted); color:var(--text); border-radius:8px;
           padding:8px 14px; font-size:14px; }
</style>
</head>
<body>
<main>
  <img class="cover" src="cover.jpg" alt="Klöbels KI Podcast">
  <h1>Klöbels KI Podcast</h1>
  <p>Jeden Tag eine Folge zu Prompting, KI-Tools und Agenten. Zum Abonnieren auf dem iPhone einfach antippen.</p>
  <a class="btn" href="podcast://moro5gh.github.io/AI-Learning-Podcast/feed.xml">In Apple Podcasts abonnieren</a>
  <div class="alt">
    Andere Podcast-App? Diese Feed-Adresse dort unter „Per URL hinzufügen“ einfügen:
    <code id="feed">https://moro5gh.github.io/AI-Learning-Podcast/feed.xml</code>
    <button id="copy" type="button">Adresse kopieren</button>
  </div>
</main>
<script>
  document.getElementById('copy').addEventListener('click', function () {
    var t = document.getElementById('feed').textContent, b = this;
    try { navigator.clipboard.writeText(t).then(function(){ b.textContent = 'Kopiert'; }); }
    catch (e) { b.textContent = 'Bitte manuell kopieren'; }
  });
</script>
</body>
</html>
